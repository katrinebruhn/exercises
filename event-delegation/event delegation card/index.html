<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        max-width: 300px;
        padding: 16px;
        text-align: center;
      }

      .card img {
        width: 100%;
        border-radius: 10px;
      }

      .card h2 {
        font-size: 1.2rem;
        margin: 12px 0 6px;
      }

      .card p {
        font-size: 0.9rem;
        color: #555;
      }

      .price {
        font-size: 1.2rem;
        font-weight: bold;
        margin: 12px 0;
      }

      .buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
      }

      button {
        flex: 1;
        margin: 0 4px;
        padding: 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.9rem;
      }

      .add-cart {
        background: #007bff;
        color: #fff;
      }

      .buy-now {
        background: #28a745;
        color: #fff;
      }
      .border {
        outline: 1px red solid;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="image" src="https://picsum.photos/300/200" alt="Product" />
      <h2>Awesome Product</h2>
      <p>High quality product that you’ll love.</p>
      <div class="price">$49.99</div>
      <div class="buttons">
        <button class="add-cart">Add to Cart</button>
        <button class="buy-now">Buy Now</button>
      </div>
    </div>

    <script>
      document.querySelector(".card").addEventListener("click", allBtnInteractions);
      document.querySelector(".card").addEventListener("pointerover", allBtnInteractions);
      document.querySelector(".card").addEventListener("pointerout", allBtnInteractions);

      function allBtnInteractions(evt) {
        // console.log("target        ", evt.target);
        // console.log("currentTarget ", evt.currentTarget);
        console.log("TYPE", evt.type);
        if (evt.type === "click") {
          if (evt.target.classList.contains("add-cart")) {
            console.log("ADD TO CART");
          } else if (evt.target.classList.contains("buy-now")) {
            console.log("BUY NOW");
          } else if (evt.target.classList.contains("image")) {
            console.log("SHOW BIG IMAGE");
          } else {
            console.log("Card interaction without interest");
          }
        } else if (evt.type === "pointerover") {
          console.log("over", evt.target);
          if (evt.target !== evt.currentTarget) {
            evt.target.classList.add("border");
          }
        } else if (evt.type === "pointerout") {
          console.log("out", evt.target);
          evt.target.classList.remove("border");
        }
        console.log("********************************************");
      }
    </script>
  </body>
</html>
