<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        /* border-radius: 0.1rem; */
        font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande", "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
        color: darkgray;
      }

      .level0 {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        height: 15rem;
        width: 15rem;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        border-radius: 0.5rem;
        cursor: pointer;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .level0:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      }

      .level1 {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        height: 10rem;
        width: 10rem;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        border-radius: 0.5rem;
        cursor: pointer;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .level1:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      }

      .level2 {
        height: 5rem;
        width: 5rem;
        background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        border-radius: 0.5rem;
        cursor: pointer;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .level2:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      h4 {
        position: absolute;
        top: 0.5rem;
        left: 0.5rem;
      }

      button {
        cursor: pointer;
      }
      .hi_lite {
        outline: 2px solid chartreuse;
      }
      /* .level1,
      button {
        cursor: pointer;
      } */
    </style>
    <script type="module" src="js.js"></script>
  </head>
  <body>
    <div class="level0">
      <h4>Level0</h4>

      <div class="level1">
        <h4>Level1</h4>
        <div class="level2">
          <h4>Level2</h4>
          <button>Button</button>
        </div>
      </div>
    </div>
  </body>
</html>
