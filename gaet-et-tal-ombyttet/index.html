<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gæt et tal ombyttet</title>
    <link rel="stylesheet" href="style.css" />
    <!-- defer gør at HTML'en indlæses før JavaScript køres -->
    <script src="script.js" defer></script>
  </head>

  <body>
    <!-- Indeholder hele spillet -->
    <main class="game-card">
      <!-- Spillets overskrift -->
      <h1>Gæt et tal</h1>

      <!-- Forklarer brugeren hvad de skal gøre -->
      <p class="intro">Tænk på et tal mellem 0 og 100</p>

      <!-- Starter spillet -->
      <button id="start">Start spil</button>

      <!-- Her vises computerens nuværende gæt -->
      <div class="guess-area">
        <h2 id="gaet"></h2>
      </div>

      <!-- Knapper hvor brugeren fortæller computeren om dens gæt -->
      <div class="answer-buttons">
        <button id="forLavt">↑ For lavt</button>
        <button id="forHoejt">↓ For højt</button>
        <button id="rigtigt">✓ Rigtigt</button>
      </div>

      <!-- Her vises det rigtige tal og hvor mange gæt computeren brugte -->
      <p id="resultat"></p>
    </main>
  </body>
</html>
